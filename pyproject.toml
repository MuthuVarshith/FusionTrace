# FusionTrace: the single dependency manifest for the whole repository.
#
#   uv lock                      # re-resolve after editing dependencies (writes uv.lock)
#   uv sync --extra dev          # local dev environment (CPU torch)
#   uv export --frozen --no-emit-project --format requirements-txt --emit-index-url -o requirements.txt
#                                # regenerate the pinned requirements.txt used by Docker / HF Spaces
#
# CI fails when uv.lock or requirements.txt is out of date with this file.
# Direct dependencies are pinned exactly; transitive pins live in uv.lock.

[project]
name = "fusiontrace"
version = "2.0.0"
description = "Privacy-first multimodal (image, audio, video) synthetic-media risk assessment"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # Web app
    "fastapi==0.143.0",
    "uvicorn[standard]==0.34.3",
    "python-multipart==0.0.20",
    "jinja2==3.1.6",
    "pyyaml==6.0.2",
    "python-dotenv==1.1.1",
    # Media decoding
    "numpy==2.2.6",
    "pillow==11.3.0",
    "soundfile==0.13.1",
    # Models (torch family resolves to CPU-only wheels, see [tool.uv.sources])
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "torchvision==0.22.1",
    "timm==1.0.19",
    "transformers==4.55.0",
    "safetensors==0.6.1",
    "huggingface-hub==0.34.3",
    # Optional AI summary (only used when GEMINI_API_KEY is set)
    "google-genai==2.23.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.10",
    "pytest==9.1.1",
    "httpx==0.28.1",
]
# LoRA fine-tuning of the image detector (backend/finetune, scripts/finetune_lora.py).
finetune = [
    "peft==0.21.2",
    "mlflow-skinny==3.17.0",
]
# Model evaluation, ONNX export/quantisation and experiment tracking (backend/mlops, workstream E).
mlops = [
    "onnx==1.19.1",
    "onnxruntime==1.30.0",
    "mlflow-skinny==3.17.0",
    "psutil==7.0.0",  # peak-RSS measurement in benchmark_models.py
]

[tool.uv]
# Application, not a library: nothing to build or install, `backend/` runs from source.
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true  # only the packages mapped below come from this index

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

# ── Tooling ─────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["backend"]
extend-exclude = ["*.ipynb", "backend/notebook"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length: long lines are left to reviewers, not enforced
    "RUF001",  # ambiguous unicode in strings (box-drawing and typographic characters are intentional)
    "RUF002",
    "RUF003",
    "B008",    # FastAPI dependency idiom: `file: UploadFile = File(...)`
]

[tool.ruff.lint.per-file-ignores]
# Pre-v2 files owned by other workstreams, ignored as found at ef4023b so CI
# passes now. Remove each entry once its owner has cleaned the file.
"backend/app/detectors/base.py" = ["UP042"]  # frozen contract: `class MediaKind(str, Enum)`
"backend/app/service.py" = ["I001", "SIM117", "UP017", "W291", "W293"]
"backend/app/main.py" = ["B904", "C416", "F401", "I001", "UP045", "W293"]
"backend/app/config.py" = ["I001", "SIM105", "W293"]
"backend/app/audio_detection.py" = ["F401", "I001", "RUF010", "SIM115", "W293"]
"backend/app/image_detection.py" = ["I001"]
"backend/scripts/evaluate_models.py" = ["E402", "I001"]
"backend/tests/test_service.py" = ["F401", "I001", "SIM117", "W293"]

[tool.ruff.lint.isort]
known-first-party = ["app", "mlops"]
