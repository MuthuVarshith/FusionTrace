[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fusiontrace"
version = "1.0.0"
description = "FusionTrace Multimodal Media Authenticity Assessment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.12",
    "google-genai>=1.0.0",
    "imageio-ffmpeg>=0.6.0",
    "jinja2>=3.1.6",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "soundfile>=0.12.0",
    "starlette>=0.38.0",
    "timm>=1.0.15",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.40.0",
    "uvicorn>=0.30.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
