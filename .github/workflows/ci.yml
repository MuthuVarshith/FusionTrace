name: CI

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.13.0"

jobs:
  lock:
    name: Lock file and requirements.txt in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv lock --check
      - name: requirements.txt matches uv.lock
        run: |
          uv export --frozen --no-emit-project --format requirements-txt --emit-index-url -o requirements.txt
          git diff --exit-code requirements.txt

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff at the version pinned in pyproject.toml
        run: |
          ruff_pin=$(python -c "import tomllib; d = tomllib.load(open('pyproject.toml', 'rb')); print(next(x for x in d['project']['optional-dependencies']['dev'] if x.startswith('ruff')))")
          python -m pip install "$ruff_pin"
      - run: ruff check .

  test:
    name: Pytest (CPU torch)
    runs-on: ubuntu-latest
    env:
      FUSIONTRACE_WARMUP: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install locked runtime + dev dependencies (CPU-only torch)
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv export --frozen --no-emit-project --format requirements-txt --emit-index-url --extra dev -o "$RUNNER_TEMP/requirements-dev.txt"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/requirements-dev.txt"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pytest

  docker:
    name: Docker build and smoke test (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t fusiontrace:ci .
      - name: Container serves /health on an overridden PORT
        run: |
          docker run -d --name ft -p 7860:7860 -e PORT=7860 -e FUSIONTRACE_DOWNLOAD_MODELS=0 -e FUSIONTRACE_WARMUP=0 fusiontrace:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7860/health && exit 0; sleep 2; done
          docker logs ft
          exit 1
