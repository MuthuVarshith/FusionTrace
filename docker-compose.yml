# Local / single-host deployment.
#
#   docker compose up --build                 # http://localhost:8000
#   PORT=9000 docker compose up               # http://localhost:9000
#   docker compose run --rm fusiontrace python scripts/download_models.py --all
#
# PORT and FUSIONTRACE_BIND are read from your shell or a .env file next to this
# file. App settings (GEMINI_API_KEY, HF_TOKEN, HF_REPO_ID, FUSIONTRACE_*) go in
# backend/.env (copy backend/.env.example); it is optional.

name: fusiontrace

services:
  fusiontrace:
    build: .
    image: fusiontrace:local
    init: true
    ports:
      # Loopback only by default (privacy-first: no LAN exposure). Set
      # FUSIONTRACE_BIND=0.0.0.0 to publish on all interfaces.
      - "${FUSIONTRACE_BIND:-127.0.0.1}:${PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: "${PORT:-8000}"
    env_file:
      - path: backend/.env
        required: false
    volumes:
      - fusiontrace-data:/app/data       # SQLite history, uploads, heatmaps
      - fusiontrace-models:/app/models   # downloaded weights, reused across restarts
    restart: unless-stopped

volumes:
  fusiontrace-data:
  fusiontrace-models:
