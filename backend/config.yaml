model_path:
  # Legacy FusionTrace weights (FUSIONTRACE_AUDIO_MODEL_PATH / FUSIONTRACE_IMAGE_MODEL_PATH override).
  audio: models/audio_model
  image: models/image_model/EfficientnetV2_model.pth
data_dir: data
# Root for detector weights downloaded from the Hugging Face Hub (FUSIONTRACE_MODEL_DIR overrides).
model_dir: models

# Which detector produces each signal. `model: default` uses the DEFAULT declared in
# app/detectors/<kind>/__init__.py. Every key can be overridden from the environment:
#   FUSIONTRACE_<KIND>_ENABLED=true|false
#   FUSIONTRACE_<KIND>_MODEL=<registry key>
#   FUSIONTRACE_<KIND>_WEIGHT=<float>
# `options` is passed to the detector unchanged; each detector documents its own keys.
detectors:
  image:
    enabled: true
    model: default          # commfor-vit-s384; see docs/model-choice-image.md
    weight: 0.9
    options:
      threshold: 0.5
      # normalization: imagenet  # efficientnetv2-legacy only: imagenet (matches training) | half (v1 inference)
  audio:
    enabled: true
    model: default
    weight: 0.9
    options:
      window_seconds: 4.0     # legacy model was trained on 4 s clips
      hop_seconds: 2.0
      max_windows: 60         # evenly spaced across the clip when exceeded
      aggregate: top_k_mean   # mean | max | top_k_mean
      top_k: 3
      threshold: 0.5
      silence_dbfs: -60       # windows quieter than this are skipped
      batch_size: 1
  video:
    # Temporal signal (between-frame consistency). The default is an uncalibrated
    # heuristic that did not separate real from fake in its quick check (AUC 0.50,
    # n=10+10), so it carries a low weight until it is calibrated.
    enabled: true
    model: default
    weight: 0.3
    options:
      max_clips: 4
      frames_per_clip: 8
      max_seconds: 120
      score_jitter: true
      score_frames_per_clip: 4
      threshold: 0.5

pipeline:
  video:
    frame_interval_seconds: 5
    max_frames: 12
    frame_weight: 0.8   # image detector on sampled frames (unchanged from v1)
    audio_weight: 0.9   # audio detector on the soundtrack (unchanged from v1)
    max_seconds: 300    # total processing budget for one video scan
